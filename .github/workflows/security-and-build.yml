name: Security And Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run forbidden capability scan
        run: scripts/scan_forbidden_capabilities.sh .

      - name: Run Swift package tests
        run: swift test

      - name: Build app target for iOS Simulator
        run: xcodebuild -project YoanTranslatorApp.xcodeproj -scheme YoanTranslatorApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
